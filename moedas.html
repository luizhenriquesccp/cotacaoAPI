<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cotação · Lista de Moedas</title>
    <meta name="description" content="Todas as moedas em reais, com bandeira, variação do dia e tendência dos últimos dias." />
    <script>
      try {
        var t = localStorage.getItem("cotacao:tema");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body data-page="moedas">
    <header class="topbar">
      <div class="wrap topbar__in">
        <a class="brand" href="index.html">
          <span class="brand__mark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></svg>
          </span>
          <span>Cotação</span>
        </a>
        <nav class="nav" aria-label="Principal">
          <a href="index.html">Conversor</a>
          <a href="moedas.html" aria-current="page">Moedas</a>
          <a href="https://luizhenriquesccp.github.io/portfolio/">Portfólio</a>
        </nav>
        <button class="icon-btn" id="tema" type="button" aria-label="Alternar tema claro/escuro">
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <main id="conteudo">
      <section class="hero wrap">
        <h1>Lista de moedas</h1>
        <p id="atualizado">Carregando cotações…</p>
      </section>

      <div class="wrap">
        <div class="toolbar">
          <label class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span class="sr-only">Buscar moeda</span>
            <input id="busca" type="search" placeholder="Buscar por nome ou código (ex.: dólar, EUR)" />
          </label>
          <label>
            <span class="sr-only">Ordenar por</span>
            <select id="ordem">
              <option value="nome">Nome (A–Z)</option>
              <option value="valor">Maior valor em R$</option>
              <option value="alta">Maiores altas do dia</option>
              <option value="queda">Maiores quedas do dia</option>
            </select>
          </label>
        </div>

        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th>Moeda</th>
                <th class="num">Valor em R$</th>
                <th class="num">No dia</th>
                <th class="num hide-sm">Últimos dias</th>
              </tr>
            </thead>
            <tbody id="currency-table-body">
              <tr><td colspan="4"><div class="skel" style="height:40px"></div></td></tr>
              <tr><td colspan="4"><div class="skel" style="height:40px"></div></td></tr>
              <tr><td colspan="4"><div class="skel" style="height:40px"></div></td></tr>
            </tbody>
          </table>
        </div>
        <p class="updated" id="contagem" aria-live="polite"></p>
      </div>
    </main>

    <footer class="footer">
      <div class="wrap footer__in">
        <span>&copy; 2025 Site desenvolvido por mim, Luiz Henrique, para praticar uso de API.</span>
        <div class="footer__links">
          <a href="https://www.instagram.com/luizinhobr7" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="https://github.com/luizhenriquesccp" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
        </div>
      </div>
    </footer>
    <script src="assets/script.js"></script>
  </body>
</html>
